<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplikasi pencatat pengeluaran harian dengan visualisasi grafik">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Expense &amp; Budget Visualizer</h1>
    <label class="theme-switch" title="Ganti tema terang/gelap">
      <input type="checkbox" id="theme-toggle" role="switch" aria-label="Mode gelap">
      <span class="slider"></span>
    </label>
  </header>

  <main class="container">
    <section class="balance-card">
      <span class="balance-label">Total Pengeluaran</span>
      <span id="total-balance" class="balance-value">Rp 0</span>
    </section>

    <section class="monthly-summary">
      <button id="prev-month" class="month-nav" type="button" aria-label="Bulan sebelumnya">&#8249;</button>
      <div class="month-info">
        <h2 id="month-label">September 2026</h2>
        <span id="month-total">Pengeluaran bulan ini: Rp 0</span>
      </div>
      <button id="next-month" class="month-nav" type="button" aria-label="Bulan berikutnya">&#8250;</button>
    </section>

    <section class="form-section">
      <h2>Tambah Transaksi</h2>
      <form id="transaction-form" novalidate>
        <div class="form-row">
          <label for="item-name">Nama Item</label>
          <input type="text" id="item-name" name="itemName" placeholder="cth. Nasi Goreng" required autocomplete="off">
        </div>
        <div class="form-row">
          <label for="item-amount">Jumlah (Rp)</label>
          <input type="number" id="item-amount" name="itemAmount" min="1" step="0.01" placeholder="cth. 25000" required inputmode="decimal">
        </div>
        <div class="form-row">
          <label for="item-category">Kategori</label>
          <select id="item-category" name="itemCategory" required></select>
        </div>
        <button type="submit" class="btn-primary">Tambah Transaksi</button>
      </form>

      <div class="custom-category">
        <div class="form-row">
          <label for="new-category">Tambah Kategori Baru</label>
          <div class="category-input-group">
            <input type="text" id="new-category" placeholder="cth. Belanja" autocomplete="off">
            <button id="add-category" class="btn-add" type="button">+ Tambah</button>
          </div>
        </div>
        <div id="category-list"></div>
      </div>
    </section>

    <section class="list-section">
      <div class="list-toolbar">
        <h2>Riwayat Transaksi</h2>
        <select id="sort-select" aria-label="Urutkan transaksi">
          <option value="newest">Terbaru</option>
          <option value="amount-desc">Jumlah terbesar</option>
          <option value="amount-asc">Jumlah terkecil</option>
          <option value="category-asc">Kategori A–Z</option>
          <option value="category-desc">Kategori Z–A</option>
        </select>
      </div>
      <ul id="transaction-list" class="transaction-list"></ul>
    </section>

    <section class="chart-section">
      <h2>Distribusi Pengeluaran</h2>
      <canvas id="category-chart" aria-label="Pie chart pengeluaran per kategori" role="img"></canvas>
    </section>
  </main>

  <footer class="app-footer">
    <p>Data disimpan di browser (Local Storage)</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
